name: Keepalive scheduled workflows

# GitHub disables a "schedule" workflow after 60 days without a commit on the
# repo. The scheduled runs themselves do NOT count as activity — only a commit
# resets the 60-day counter. This workflow pushes an empty commit as soon as the
# repo has been idle for more than 45 days, which keeps the nightly bootstrap
# (and every other scheduled workflow) alive indefinitely.
#
# Manual test: Actions tab -> this workflow -> "Run workflow" with force=true,
# or:  gh workflow run keepalive.yml -f force=true

on:
  schedule:
    - cron: '17 4 * * 1'   # every Monday 04:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a keepalive commit right now (for testing)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  keepalive:
    name: Empty commit if the repo has been idle too long
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Push an empty commit when idle > 45 days (or forced)
        run: |
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was $days days ago (threshold: 45)."
          if [ "$days" -ge 45 ] || [ "${{ inputs.force }}" = "true" ]; then
            git config user.email "ci-nightly@muninn.local"
            git config user.name "MUNINN Keepalive Bot"
            git commit --allow-empty -m "chore(keepalive): empty commit to keep scheduled workflows active (${days}d idle)"
            git push
            echo "Keepalive commit pushed."
          else
            echo "Nothing to do — repo is active."
          fi
