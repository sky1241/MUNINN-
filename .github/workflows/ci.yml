name: MUNINN CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# CHUNK C12 (H4.1): explicit least-privilege permissions.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Engine + Mycelium + Tree

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          # Aligned with Sky's local env (pyenv 3.13). Brick19 dead-code
          # AST scan behaves differently between 3.11 and 3.13 (3.11 misses
          # dict-lookup imports in scanner/orchestrator.py).
          python-version: '3.13'

      - name: Validate Tree Integrity
        run: |
          python3 - <<'EOF'
          import json, sys, os

          with open("memory/tree.json", encoding="utf-8") as f:
              tree = json.load(f)

          errors = []
          nodes = tree["nodes"]
          budget = tree["budget"]

          for name, node in nodes.items():
              filepath = os.path.join("memory", node["file"])
              if not os.path.exists(filepath):
                  errors.append(f"Node '{name}': file '{filepath}' not found")
                  continue

              with open(filepath, encoding="utf-8") as f:
                  actual_lines = sum(1 for _ in f)

              max_lines = node["max_lines"]
              if actual_lines > max_lines:
                  errors.append(f"Node '{name}': {actual_lines} lines > budget {max_lines} (R1 VIOLATION)")

              declared = node["lines"]
              if abs(actual_lines - declared) > 2:
                  errors.append(f"Node '{name}': declared {declared} lines but actual {actual_lines}")

          root = nodes.get("root", {})
          for child in root.get("children", []):
              if child not in nodes:
                  errors.append(f"Root child '{child}' not in nodes")

          for name, node in nodes.items():
              for field in ["type", "file", "lines", "max_lines"]:
                  if field not in node:
                      errors.append(f"Node '{name}' missing field '{field}'")

          if errors:
              print("TREE ERRORS:")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)

          print(f"OK Tree valid — {len(nodes)} nodes, all within budget")
          EOF

      - name: Test Engine Commands
        run: |
          python3 - <<'EOF'
          import subprocess, sys

          # CHUNK MCP D.4 hotfix (2026-05-12): on a fresh CI checkout there's
          # no .muninn/ yet. Pre-D.4 `muninn status` silently auto-init'd a
          # tree in MUNINN_ROOT (RULE 1 violation). D.4 fixed that by
          # short-circuiting to "No .muninn/ found, run muninn init". We now
          # run `muninn init` first to bring the dir into a valid state
          # before exercising the read commands.
          r = subprocess.run(["python3", "engine/core/muninn.py", "init"],
                             capture_output=True, text=True)
          assert r.returncode == 0, f"init failed: {r.stderr}"
          assert "Muninn ready" in r.stdout, f"init missing 'Muninn ready':\n{r.stdout}"
          print(r.stdout)

          # Test status
          r = subprocess.run(["python3", "engine/core/muninn.py", "status"],
                             capture_output=True, text=True)
          assert r.returncode == 0, f"status failed: {r.stderr}"
          assert "MUNINN TREE" in r.stdout, "status output missing header"
          assert "OVER!" not in r.stdout, f"Budget violation detected:\n{r.stdout}"
          print(r.stdout)

          # Test prune (dry run)
          r = subprocess.run(["python3", "engine/core/muninn.py", "prune"],
                             capture_output=True, text=True)
          assert r.returncode == 0, f"prune failed: {r.stderr}"
          print(r.stdout)

          # Test compress
          r = subprocess.run(["python3", "engine/core/muninn.py", "compress", "README.md"],
                             capture_output=True, text=True)
          assert r.returncode == 0, f"compress failed: {r.stderr}"
          assert "MUNINN" in r.stdout, "compress output missing header"
          print("compress: OK")

          # Test boot
          r = subprocess.run(["python3", "engine/core/muninn.py", "boot"],
                             capture_output=True, text=True)
          assert r.returncode == 0, f"boot failed: {r.stderr}"
          assert "root" in r.stdout.lower(), "boot output missing root"
          print("boot: OK")

          print("OK Engine commands all pass")
          EOF

      - name: Test Mycelium
        run: |
          python3 - <<'EOF'
          import subprocess, sys

          # Test mycelium simulate
          r = subprocess.run(
              ["python3", "engine/core/mycelium.py", "simulate", "."],
              capture_output=True, text=True
          )
          assert r.returncode == 0, f"simulate failed: {r.stderr}"
          assert "MYCELIUM" in r.stdout, "simulate output missing header"
          assert "Fusions" in r.stdout, "simulate should produce fusions"
          print(r.stdout[:500])

          # Test bootstrap on this repo (smoke test — --max-files 30 keeps it
          # under ~3min instead of the ~47min full bootstrap. Validates the
          # same pipeline-runs invariant: if the pipeline crashes on any file
          # type, it crashes on the first one, not the 500th. A full nightly
          # bootstrap is the place for repo-scale validation.)
          r = subprocess.run(
              ["python3", "engine/core/muninn.py", "bootstrap", ".", "--max-files", "10"],
              capture_output=True, text=True
          )
          assert r.returncode == 0, f"bootstrap failed: {r.stderr}"
          assert "BOOTSTRAP" in r.stdout, "bootstrap output missing header"
          assert "Scanned" in r.stdout, "bootstrap should report scanned files"
          print("bootstrap: OK")

          print("OK Mycelium tests pass")
          EOF

      - name: Install Qt system libs (H.2b — UI tests need headless EGL/X11 stubs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Install pytest + runtime deps
        run: |
          python3 -m pip install --upgrade pip
          # forge-shield is on PyPI since 2026-05-11 v1.3.0 (Sky bump cycle 11+).
          # Bumped from v1.2.2 → v1.3.0 (cycles 9-10 add --shield orchestration
          # + hook installer + venv exclusion fix ; v1.3.0 cycle 11+ Sky bump).
          # CHUNK MCP F.2 (2026-05-12): added mcp to base CI install so the
          # E.4/E.6/F.1 tests that subprocess `python -m muninn.mcp.server`
          # don't crash with ImportError. Was the root cause of 6 consecutive
          # red CI runs (E.3→F.1). Tests also got `pytest.importorskip("mcp")`
          # as defense-in-depth for environments without [mcp] extra.
          # H.2b (2026-05-12): added PyQt6 + pytest-qt so the 173 UI tests
          # can run in QT_QPA_PLATFORM=offscreen mode (no X server needed).
          # 2026-05-20 : `build` + `setuptools>=68` ajoutés pour
          # test_e6_sdist_excludes_internal (slow, précédemment skippé).
          # Le test fait `python -m build --sdist --no-isolation` qui
          # exige setuptools.build_meta dans l'env runner (pas isolé).
          python3 -m pip install -c constraints.txt \
            pytest hypothesis tiktoken anthropic numpy cryptography freezegun \
            forge-shield mcp PyQt6 pytest-qt build "setuptools>=68" wheel

      - name: Configure git identity (required by sync_backend tests)
        run: |
          git config --global user.email "ci@muninn.local"
          git config --global user.name "MUNINN CI"
          git config --global init.defaultBranch main

      - name: Reset .muninn state (avoid cross-test mycelium pollution)
        run: |
          # brick15 expects an empty subgraph for unknown seeds, but
          # earlier steps populate the mycelium with this repo's words.
          # Cleaning gives us a deterministic starting point.
          rm -rf .muninn

      - name: Pytest suite (UI tests included via QT_QPA_PLATFORM=offscreen)
        env:
          # CHUNK C12 (H4.1): explicit opt-out from real-API tests in CI.
          MUNINN_RUN_REAL_API_TESTS: "0"
          MUNINN_RUN_REAL_LLM_TESTS: "0"
          # H.2b (2026-05-12): UI tests now run on the headless runner via
          # Qt's offscreen platform plugin. Requires libegl1/libxkbcommon0
          # apt deps installed in the previous step.
          QT_QPA_PLATFORM: offscreen
          # 2026-05-20 (Sky request) : "rebrancher tout le pipeline tests"
          # → MUNINN_RUN_PERF=1 active tests/test_perf_*.py (opt-in C13).
          MUNINN_RUN_PERF: "1"
        run: |
          # Excludes:
          #   - eval_harness_*: cost money (Anthropic API), opt-in only
          # Deselected (real, tracked debt):
          #   - test_retrieval_benchmark::test_tfidf_relevance_meaningful
          #     depends on tree.json content, P5 debt
          #   - test_retrieval_benchmark::test_actr_activation_varies
          #     flaky on small trees (std=0 when access_counts uniform)
          # Deselected (CI-env-only — not a real bug, not reproducible locally):
          #   - test_chunk1_auto_memory_disabled::*
          #     settings.json key set in .claude/settings.local.json
          #     (gitignored → absent in CI checkout)
          #   - test_chunk_a7_hook_integrity::*
          #     git checkout normalises perms (0o644) + line endings,
          #     breaking the local sha256 manifest. Sky's local repo has
          #     chmod 0600 + native LF.
          # H.2b (2026-05-12): test_ui_*.py REACTIVATED in CI — 173 tests
          # now run in QT_QPA_PLATFORM=offscreen. Were ignored pre-H.2b
          # because PyQt6 + pytest-qt + apt libs were missing in CI.
          #
          # 2026-05-20 (Sky request) : `-m "not slow"` retiré pour activer
          # les 23 tests slow (MCP server scaffold, e6_hardened, f1_uninstall
          # complet). CI passe de ~25min à ~50min mais teste TOUT le pipeline.
          python3 -m pytest tests/ -q --tb=short \
            --ignore=tests/eval_harness_chunk9.py \
            --ignore=tests/eval_harness_chunk11.py \
            --deselect tests/test_chunk_a7_hook_integrity.py::test_hooks_perms_no_world_read \
            --deselect tests/test_retrieval_benchmark.py::test_actr_activation_varies

      - name: Benchmark Factual Retention (P35)
        run: |
          python3 tests/benchmark/run_benchmark.py
          echo "Benchmark exit code: $?"

      - name: Test Feed (transcript parsing)
        run: |
          python3 - <<'EOF'
          import json, subprocess, sys, tempfile, os

          # Create a fake transcript JSONL to test feed parsing
          transcript = []
          transcript.append(json.dumps({
              "type": "user",
              "message": {"role": "user", "content": [
                  {"type": "text", "text": "Fix the mycelium compression pipeline for the tree scanner"}
              ]}
          }))
          transcript.append(json.dumps({
              "type": "assistant",
              "message": {"role": "assistant", "content": [
                  {"type": "text", "text": "The mycelium tracks co-occurrences between concepts in the compression tree. Let me fix the scanner pipeline for better fusion detection."}
              ]}
          }))
          transcript.append(json.dumps({
              "type": "user",
              "message": {"role": "user", "content": [
                  {"type": "text", "text": "Also check the bootstrap cold start function and the codebook loading"}
              ]}
          }))

          # Write fake transcript
          with tempfile.NamedTemporaryFile(mode="w", suffix=".jsonl", delete=False, encoding="utf-8") as f:
              f.write("\n".join(transcript))
              tmp_path = f.name

          try:
              # Test feed from specific file
              r = subprocess.run(
                  ["python3", "engine/core/muninn.py", "feed", tmp_path, "--repo", "."],
                  capture_output=True, text=True
              )
              assert r.returncode == 0, f"feed failed: {r.stderr}"
              assert "MUNINN FEED" in r.stdout, f"feed output missing header: {r.stdout}"
              assert "3 messages" in r.stdout, f"Expected 3 messages: {r.stdout}"
              assert "MUNINN SESSION" in r.stdout, f"session compression missing: {r.stdout}"
              print(f"feed from file: OK — {r.stdout.strip()}")

              # Verify mycelium was actually fed (S1: now uses SQLite)
              mycelium_db = os.path.join(".muninn", "mycelium.db")
              mycelium_json = os.path.join(".muninn", "mycelium.json")
              assert os.path.exists(mycelium_db) or os.path.exists(mycelium_json), \
                  "Neither mycelium.db nor mycelium.json created"
              if os.path.exists(mycelium_db):
                  import sqlite3
                  conn = sqlite3.connect(mycelium_db)
                  edge_count = conn.execute("SELECT COUNT(*) FROM edges").fetchone()[0]
                  conn.close()
                  assert edge_count > 0, "No connections created in SQLite"
                  print(f"  mycelium: {edge_count} connections (SQLite)")
              else:
                  with open(mycelium_json, encoding="utf-8") as mf:
                      data = json.load(mf)
                  assert len(data["connections"]) > 0, "No connections created"
                  print(f"  mycelium: {len(data['connections'])} connections (JSON)")

              # Verify session .mn was created
              sessions_dir = os.path.join(".muninn", "sessions")
              assert os.path.exists(sessions_dir), "sessions dir not created"
              mn_files = [f for f in os.listdir(sessions_dir) if f.endswith(".mn")]
              assert len(mn_files) > 0, "No session .mn file created"
              print(f"  session file: {mn_files[0]}")

          finally:
              os.unlink(tmp_path)

          print("OK Feed tests pass")
          EOF

  forge_smoke:
    runs-on: ubuntu-latest
    name: forge --gen-props (smoke per engine/core module)
    needs: [validate]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install forge-shield + deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -c constraints.txt pytest hypothesis tiktoken anthropic numpy cryptography freezegun forge-shield mcp
      - name: Generate property tests for every engine/core module (forge --gen-props)
        run: |
          # CHUNK D8 (H4.2): smoke-run forge --gen-props on every critical
          # engine/core module — catches BUG-101/102/105/106-class bugs early.
          # F6 (2026-05-10 PM): smoke matrix étendue de 11 → 17 modules,
          # synchronisée avec l'inventaire des fichiers tests/test_props_*.py.
          # Les 13 modules absents (sub-modules P3 + mixins H6 + sync_tls/vault/
          # wal_monitor/watchdog/muninn) n'ont pas de fonction publique fuzzable.
          for f in engine/core/muninn_tree.py \
                   engine/core/muninn_layers.py \
                   engine/core/muninn_feed.py \
                   engine/core/mycelium_db.py \
                   engine/core/mycelium.py \
                   engine/core/_secrets.py \
                   engine/core/cube.py \
                   engine/core/cube_providers.py \
                   engine/core/cube_analysis.py \
                   engine/core/sync_backend.py \
                   engine/core/_hook_logger.py \
                   engine/core/budget_select.py \
                   engine/core/dedup.py \
                   engine/core/forge_metrics.py \
                   engine/core/lang_lexicons.py \
                   engine/core/lexicons.py \
                   engine/core/sentiment.py
          do
              echo "::group::forge --gen-props $f"
              forge --gen-props "$f" || exit 1
              echo "::endgroup::"
          done
      - name: Run all generated property tests (test_props_*.py)
        run: |
          pytest tests/test_props_*.py -q --tb=short

  e2e:
    # Chunk MCP A.4: E2E pip install from scratch + muninn init + doctor ALL GREEN.
    # Push-only (not on PRs) — pip install -e takes 60-120s, would slow every PR.
    # Validates that Phase A (SessionStart + SessionEnd sync + install-cron) works
    # end-to-end from a vierge venv.
    if: github.event_name == 'push'
    needs: [validate]
    runs-on: ubuntu-latest
    name: E2E pip install from scratch (Phase A pin)
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pytest in the runner Python
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest
      - name: Run E2E pin (creates venv + pip install -e + muninn init + doctor)
        env:
          MUNINN_RUN_E2E: "1"
        run: |
          pytest tests/test_e2e_pip_install_from_scratch.py -v --tb=short
