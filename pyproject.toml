[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "muninn-memory"
version = "1.1.0"
description = "LLM memory compression engine — compresses session transcripts into dense .mn files"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Sky", email = "sky1241@users.noreply.github.com" },
]
keywords = ["llm", "memory", "compression", "context-window", "ai"]
# G.8 (2026-05-12): honest version claim. CI runs only on 3.13 (pyenv on
# Sky's box); 3.10/3.11/3.12 are NOT tested in this release. Re-add them
# once the matrix CI fans out (post-1.1.0).
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: General",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.5"]
llm = ["anthropic>=0.20"]
quality = ["forge-shield>=2.1.0"]  # Phase 4 (2026-05-09): regression shield + carmack/locate/modularity for cube heatmap UX
mcp = ["mcp>=1.7.1,<2.0"]  # Phase B (2026-05-11): MCP server for Claude Code integration
ui = ["PyQt6>=6.10"]  # H.2 (2026-05-12): muninn-ui desktop console script
embeddings = ["sentence-transformers>=2.7"]  # K.2 (2026-05-14): LaBSE cross-lingual fusion
all = ["tiktoken>=0.5", "anthropic>=0.20", "forge-shield>=2.1.0", "mcp>=1.7.1,<2.0", "PyQt6>=6.10", "sentence-transformers>=2.7"]

[project.urls]
Homepage = "https://github.com/sky1241/MUNINN-"
Repository = "https://github.com/sky1241/MUNINN-"
Issues = "https://github.com/sky1241/MUNINN-/issues"

[project.scripts]
# CHUNK MCP E.3 (2026-05-12): renamed from `muninn` / `mycelium` / `muninn-mcp`
# to avoid PyPI prod binary name collision with:
#   - `muninn` 7.2.1 (S&T data catalog, unrelated to LLM memory)
#   - `mycelium` 0.4.9 (greenbyte/luigi, abandoned 2019)
#   - `muninn-mcp` 0.2.0 (Ilwon Yoon, different MCP project)
# Suffix `-mem` clearly identifies these as part of muninn-memory.
muninn-mem = "muninn._engine:main"
muninn-mycel = "muninn.mycelium:main"
muninn-mcp-mem = "muninn.mcp.server:main"
# H.2 (2026-05-12): muninn-ui = PyQt6 desktop (11 712 LOC débloquées).
# Requires `pip install 'muninn-memory[ui]'`.
muninn-ui = "muninn.ui.main_window:main"

[tool.setuptools.packages.find]
# CHUNK MCP D.1 (2026-05-12): ship both muninn/ AND engine/ packages.
# The shims in muninn/* (tokenizer, _secrets, vault, mycelium, etc.) do
# `from X import *` (bare name) after injecting engine/core/ into sys.path
# at import time. In a pip-installed wheel, that injection points to a
# non-existent dir unless we also ship engine/core/. Confirmed broken at
# 0.9.2 by venv install + `muninn --help` → ModuleNotFoundError 'tokenizer'.
include = ["muninn*", "engine*"]

[tool.setuptools.package-data]
"muninn" = ["*.py"]
# K.1 (2026-05-13): ship the offline FR→EN lexicon JSON inside the wheel
# so ConceptTranslator works without an Anthropic API key.
"engine.core.data.lexicons" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 2026-05-13 drift-fix : retiré 5 markers jamais utilisés (phase, tier, cube,
# scanner, audit) — déclaration historique sans backing. Audit 5 (Agent
# conftest) a confirmé 0 grep dans tests/.
markers = [
    "slow: Tests that hit external APIs or take >10s",
    "e2e: End-to-end install + init tests (opt-in via MUNINN_RUN_E2E=1, ~60-120s)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# R13.5 (2026-05-26): senior-dev linting baseline. Conservative rules to avoid
# breaking the existing 3000+ test suite — strict mode can be enabled later
# once the codebase has been migrated.
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    ".muninn",
    "tests/.test_intelligence",
    "muninn/ui/templates",
    "muninn/ui/assets",
    "docs/archive",
]

[tool.ruff.lint]
# Start with a SAFE rule set — Pyflakes (F) catches real bugs without
# stylistic noise. Sky can add E/W/I/B later as the codebase migrates.
select = ["F", "E9"]
ignore = [
    "F401",  # unused imports (many shim files re-export)
    "F403",  # star imports (documented at sites)
    "F405",  # may be undefined (star import side-effect)
    "F541",  # f-string without placeholder (cosmetic, 86 sites pre-existing)
    "F811",  # redefinition (test fixtures sometimes need this)
    "F841",  # unused local (intentional in some places)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F"]  # test files have looser rules

[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = '''
/(
    \.muninn
  | muninn/ui/templates
  | muninn/ui/assets
  | docs/archive
)/
'''

[tool.mypy]
# Mypy is OPT-IN for now (codebase has 71% return-type coverage per R13.5 audit).
# Run manually: `mypy engine/core/ --ignore-missing-imports --no-strict-optional`
python_version = "3.13"
ignore_missing_imports = true
no_strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    "\\.muninn",
    "muninn/ui/templates",
    "muninn/ui/assets",
    "tests/\\.test_intelligence",
]

[tool.coverage.run]
source = ["engine.core", "muninn"]
omit = [
    "*/tests/*",
    "*/.muninn/*",
    "muninn/ui/templates/*",
    "muninn/ui/assets/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
